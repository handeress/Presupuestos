<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Presupuestos</title>
<meta name="theme-color" content="#2f4a3a">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<style>
:root{--fondo:#f4f2ee;--tarjeta:#fff;--texto:#1f2421;--mut:#6b706c;--linea:#e2ded6;--acento:#2f4a3a;--acento2:#4f7a5f;--rojo:#b23b2e;--ambar:#a86b00;--azul:#2c5d8a;--r:10px}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px;color:var(--texto);background:var(--fondo);-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:20;background:var(--acento);color:#fff;display:flex;align-items:center;gap:8px;padding:10px 12px;padding-top:max(10px,env(safe-area-inset-top))}
header h1{font-size:17px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header button{background:none;border:0;color:#fff;font-size:20px;padding:4px 8px;cursor:pointer}
#buscar{width:100%;padding:9px 12px;border-radius:8px;border:1px solid var(--linea);background:#fff}
nav{position:fixed;bottom:0;left:0;right:0;z-index:20;display:flex;background:#fff;border-top:1px solid var(--linea);padding-bottom:env(safe-area-inset-bottom)}
nav a{flex:1;text-align:center;padding:8px 2px 7px;color:var(--mut);text-decoration:none;font-size:12px}
nav a b{display:block;font-size:19px;font-weight:400;line-height:1.2}
nav a.on{color:var(--acento);font-weight:600}
main{padding:12px 12px 90px;max-width:1300px;margin:0 auto}
.dos{display:block}
@media(min-width:900px){.dos{display:grid;grid-template-columns:380px 1fr;gap:14px;align-items:start}.dos>.izq{position:sticky;top:64px;max-height:calc(100vh - 140px);overflow:auto}}
.card{background:var(--tarjeta);border:1px solid var(--linea);border-radius:var(--r);margin:0 0 10px}
.pad{padding:12px}
.fila{display:flex;align-items:center;gap:8px;padding:10px 12px;border-top:1px solid var(--linea);cursor:pointer}
.fila:first-child{border-top:0}
.fila .t{flex:1;min-width:0}
.fila .t small{display:block;color:var(--mut);font-size:12px}
.fila .v{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.fila.sel{background:#eef3ef}
.mut{color:var(--mut)}.peq{font-size:12px}
h2{font-size:15px;margin:16px 4px 8px;color:var(--acento)}
details>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px;padding:11px 12px;font-weight:600}
details>summary::-webkit-details-marker{display:none}
details>summary:before{content:"▸";color:var(--mut);transition:.15s}
details[open]>summary:before{transform:rotate(90deg)}
details>summary .s{margin-left:auto;font-weight:600;font-variant-numeric:tabular-nums}
.chip{display:inline-block;font-size:11px;padding:1px 7px;border-radius:20px;background:#eee;color:#555;margin-left:4px;font-weight:500;vertical-align:middle}
.chip.est{background:#fff3d6;color:var(--ambar)}.chip.ok{background:#e3f0e6;color:var(--acento)}.chip.bl{background:#e4ecf5;color:var(--azul)}.chip.rojo{background:#fbe4e1;color:var(--rojo)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:8px;padding:9px 14px;background:var(--acento);color:#fff;cursor:pointer;font-weight:600}
.btn.sec{background:#e9e6df;color:var(--texto)}.btn.peli{background:var(--rojo)}.btn.mini{padding:5px 10px;font-size:13px}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.fab{position:fixed;right:16px;bottom:76px;z-index:21;width:54px;height:54px;border-radius:50%;border:0;background:var(--acento);color:#fff;font-size:28px;box-shadow:0 3px 10px #0003;cursor:pointer}
label.c{display:block;margin:8px 0}label.c>span{display:block;font-size:12px;color:var(--mut);margin-bottom:3px}
input.i,select.i,textarea.i{width:100%;padding:8px 10px;border:1px solid var(--linea);border-radius:8px;background:#fff}
input.num{text-align:right;font-variant-numeric:tabular-nums}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.comp{border-top:1px solid var(--linea);padding:9px 12px}
.comp .n{display:flex;gap:6px;align-items:baseline}
.comp .n .t{flex:1;min-width:0}
.comp .cn{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:6px;margin-top:6px;align-items:end}
.comp .cn label{font-size:11px;color:var(--mut)}
.comp .cn input{width:100%;padding:6px 7px;border:1px solid var(--linea);border-radius:6px;text-align:right}
.x{background:none;border:0;color:var(--mut);font-size:18px;cursor:pointer;padding:0 4px}
.tot{display:flex;justify-content:space-between;padding:6px 12px;font-variant-numeric:tabular-nums}
.tot.g{font-size:17px;font-weight:700;border-top:2px solid var(--acento);padding-top:10px}
.aviso{background:#fff3d6;color:#6b4700;border-radius:8px;padding:9px 12px;margin:8px 0;font-size:13px}
.vacio{text-align:center;color:var(--mut);padding:30px 10px}
#modal{position:fixed;inset:0;background:#0006;z-index:50;display:none;align-items:flex-end;justify-content:center}
#modal.on{display:flex}
#modal .box{background:#fff;width:100%;max-width:640px;max-height:88vh;overflow:auto;border-radius:14px 14px 0 0;padding:14px}
@media(min-width:700px){#modal{align-items:center}#modal .box{border-radius:14px}}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#222;color:#fff;padding:9px 16px;border-radius:20px;font-size:14px;z-index:60;display:none}
.lista-sel .fila{cursor:pointer}
table.imp{width:100%;border-collapse:collapse;font-size:12px}
table.imp th,table.imp td{border-bottom:1px solid #ccc;padding:4px 5px;text-align:left;vertical-align:top}
table.imp td.n,table.imp th.n{text-align:right;white-space:nowrap}
table.imp tr.cap td{font-weight:700;background:#eee}
#impresion{display:none}
@media print{
 body{background:#fff}header,nav,.fab,main,#toast,#modal{display:none!important}
 #impresion{display:block;font-size:12px;color:#000}
 @page{size:letter landscape;margin:12mm}
 .salto{page-break-before:always}
}
#impresion h1{font-size:18px;margin:0 0 4px}#impresion h3{margin:14px 0 6px;font-size:14px}
#impresion .enc{display:flex;justify-content:space-between;border-bottom:2px solid #2f4a3a;padding-bottom:6px;margin-bottom:10px}
.tabla-tot{margin-left:auto;margin-top:10px;width:330px}
.tabla-tot td{padding:3px 5px}.tabla-tot td.n{text-align:right}
</style>
</head>
<body>
<header><button id="atras" aria-label="Atrás" hidden>←</button><h1 id="titulo">Presupuestos</h1><button id="btnMenu" aria-label="Más">⋯</button></header>
<main id="vista"></main>
<nav>
 <a href="#presupuestos" data-n="presupuestos"><b>▤</b>Presupuestos</a>
 <a href="#biblioteca" data-n="biblioteca"><b>❖</b>APU</a>
 <a href="#insumos" data-n="insumos"><b>◫</b>Insumos</a>
 <a href="#mo" data-n="mo"><b>⚒</b>Mano de obra</a>
 <a href="#ajustes" data-n="ajustes"><b>⚙</b>Ajustes</a>
</nav>
<button class="fab" id="fab" hidden>+</button>
<div id="modal"><div class="box" id="modalBox"></div></div>
<div id="toast"></div>
<div id="impresion"></div>
<script>
'use strict';
/* ================= Datos ================= */
const DB_NAME='presupuestos-db';let D=null;const $=(s,e=document)=>e.querySelector(s),$$=(s,e=document)=>[...e.querySelectorAll(s)];
function idb(){return new Promise((ok,mal)=>{const r=indexedDB.open(DB_NAME,1);r.onupgradeneeded=()=>{r.result.createObjectStore('kv')};r.onsuccess=()=>ok(r.result);r.onerror=()=>mal(r.error)})}
async function kvGet(k){const db=await idb();return new Promise((ok,mal)=>{const t=db.transaction('kv').objectStore('kv').get(k);t.onsuccess=()=>ok(t.result);t.onerror=()=>mal(t.error)})}
async function kvSet(k,v){const db=await idb();return new Promise((ok,mal)=>{const t=db.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=()=>ok();t.onerror=()=>mal(t.error)})}
let tGuardar=null;
function guardar(){D.mod=new Date().toISOString();clearTimeout(tGuardar);tGuardar=setTimeout(guardarYa,400)}
async function guardarYa(){try{await kvSet('datos',D);const h=(await kvGet('historial'))||[];const ult=h[0];if(!ult||Date.now()-new Date(ult.fecha).getTime()>10*60000){h.unshift({fecha:new Date().toISOString(),datos:JSON.parse(JSON.stringify(D))});await kvSet('historial',h.slice(0,15))}}catch(e){toast('No se pudo guardar: '+e.message)}}
const uid=p=>(p||'x')+'-'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const norm=s=>(s||'').toString().toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
const esc=s=>(s==null?'':String(s)).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>'$'+Math.round(n||0).toLocaleString('es-CO');
const fnum=(n,d=3)=>{n=+n||0;return Number.isInteger(n)?String(n):String(+n.toFixed(d)).replace('.',',')};
const pnum=s=>{if(typeof s==='number')return s;s=String(s||'').trim().replace(/\$|\s/g,'');if(!s)return 0;if(s.includes('/')){const[a,b]=s.split('/');const d=pnum(b);return d?pnum(a)/d:0}
  if(s.includes(','))return parseFloat(s.replace(/\./g,'').replace(',','.'))||0;const pts=s.split('.');if(pts.length>2)return parseFloat(s.replace(/\./g,''))||0;
  if(pts.length===2&&pts[1].length===3&&+pts[0]>0)return parseFloat(pts[0]+pts[1])||0;return parseFloat(s)||0};
const hoy=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const redMil=n=>Math.round(n/1000)*1000;
function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(e._t);e._t=setTimeout(()=>e.style.display='none',2600)}

/* ================= Cálculo ================= */
const ins=id=>D.insumos.find(x=>x.id===id);
const apuDe=id=>D.apus.find(x=>x.id===id);
const cargo=id=>D.cargos.find(x=>x.id===id);
const cuad=id=>D.cuadrillas.find(x=>x.id===id);
function costoCuadrilla(id){const q=cuad(id);if(!q)return 0;return q.miembros.reduce((s,m)=>s+(cargo(m.cargo)?.jornal||0)*m.cant,0)}
function costoMO(mo){if(!mo)return 0;if(mo.modo==='cuadrilla')return mo.rend>0?costoCuadrilla(mo.cuadrilla)/mo.rend:0;if(mo.modo==='dias')return costoCuadrilla(mo.cuadrilla)*(mo.dias||0);return +mo.valor||0}
function calcAPU(a,pila=[]){
  const r={mat:0,bas:0,eq:0,tr:0,mo:0,herr:0,total:0,lineas:[]};if(!a)return r;
  if(pila.includes(a.id)){r.error='APU básico circular';return r}
  for(const c of a.comp||[]){
    if(c.tipo==='bas'){const b=apuDe(c.apu);const pu=b?calcAPU(b,[...pila,a.id]).total:0;const v=c.cant*(1+(c.desp||0)/100)*pu;r.bas+=v;r.lineas.push({c,nombre:b?b.nombre:'(básico borrado)',und:b?.und||'',precio:pu,v})}
    else{const i=ins(c.ins);const p=i?i.precio:0;const v=c.cant*(1+(c.desp||0)/100)*p;const k=c.tipo==='mat'?'mat':(i?.tipo==='transporte'?'tr':'eq');r[k]+=v;r.lineas.push({c,nombre:i?i.nombre:'(insumo borrado)',und:i?.und||'',precio:p,v,est:i?.est})}
  }
  r.mo=costoMO(a.mo);r.herr=a.mo?.modo==='contratista'?0:r.mo*(a.herr??D.config.herrPct)/100;
  r.total=r.mat+r.bas+r.eq+r.tr+r.mo+r.herr;return r}
function apuEstimado(a,pila=[]){if(a.est)return true;for(const c of a.comp||[]){if(c.tipo==='bas'){const b=apuDe(c.apu);if(b&&!pila.includes(b.id)&&apuEstimado(b,[...pila,a.id]))return true}else if(ins(c.ins)?.est)return true}return false}
function itemAPU(p,it){return it.tipo==='rapido'?it.apu:apuDe(it.apu)}
function puItem(p,it){if(p.estado==='aprobado'&&it.puCongelado!=null)return it.puCongelado;return calcAPU(itemAPU(p,it)).total}
function calcPres(p){
  let cd=0;const caps=p.capitulos.map(c=>{const st=c.items.reduce((s,it)=>s+puItem(p,it)*(+it.cant||0),0);cd+=st;return st});
  const a=cd*p.aiu.a/100,i=cd*p.aiu.i/100,u=cd*p.aiu.u/100;let iva=0;const t=(D.config.ivaPct||19)/100;
  if(p.ivaModo==='utilidad')iva=u*t;else if(p.ivaModo==='pleno')iva=(cd+a+i+u)*t;
  const total=cd+a+i+u+iva;return{caps,cd,a,i,u,iva,total,totalRed:redMil(total)}}

/* ================= Navegación ================= */
const esPC=()=>matchMedia('(min-width:900px)').matches;
let RUTA=[];window.addEventListener('hashchange',render);
function ir(h){if(location.hash==='#'+h)render();else location.hash=h}
function setTitulo(t,atras){$('#titulo').textContent=t;$('#atras').hidden=!atras;$('#atras').onclick=()=>history.length>1?history.back():ir(atras)}
function fab(f){const b=$('#fab');b.hidden=!f;b.onclick=f||null}
function render(){
  RUTA=(location.hash.slice(1)||'presupuestos').split('/').map(decodeURIComponent);const r=RUTA[0];
  $$('nav a').forEach(a=>a.classList.toggle('on',a.dataset.n===r||(r==='apu'&&a.dataset.n==='biblioteca')||(r==='p'&&a.dataset.n==='presupuestos')));
  fab(null);const v=$('#vista');v.innerHTML='';window.scrollTo(0,0);
  if(r==='presupuestos')vPresupuestos(v);else if(r==='p')vPresupuesto(v,RUTA[1],RUTA[2],RUTA[3]);
  else if(r==='biblioteca'||r==='apu')vBiblioteca(v,RUTA[1]);else if(r==='insumos')vInsumos(v,RUTA[1]);
  else if(r==='mo')vMO(v);else if(r==='ajustes')vAjustes(v);else vPresupuestos(v)}
$('#btnMenu').onclick=()=>modal(`<h3 style="margin-top:0">Más</h3><div class="btns"><button class="btn sec" onclick="exportar()">Descargar respaldo</button><button class="btn sec" onclick="cerrarModal();ir('ajustes')">Ajustes</button><button class="btn sec" onclick="cerrarModal()">Cerrar</button></div>`);

/* ================= Modal ================= */
function modal(html,on){$('#modalBox').innerHTML=html;$('#modal').classList.add('on');on&&on($('#modalBox'))}
function cerrarModal(){$('#modal').classList.remove('on')}
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')cerrarModal()});

/* ================= Presupuestos ================= */
const ESTADOS={borrador:'Borrador',enviado:'Enviado',aprobado:'Aprobado'};
function vPresupuestos(v){
  setTitulo('Presupuestos');fab(nuevoPresupuesto);
  if(!D.presupuestos.length){v.innerHTML=`<div class="vacio">Aún no hay presupuestos.<br><br><button class="btn" onclick="nuevoPresupuesto()">Crear el primero</button><br><br><label class="btn sec">Sumar desde archivo<input type="file" accept=".json" hidden onchange="sumarArchivo(this.files[0])"></label></div>`;return}
  const L=[...D.presupuestos].sort((a,b)=>(b.mod||'').localeCompare(a.mod||''));
  v.innerHTML='<div class="card">'+L.map(p=>{const t=calcPres(p);return`<div class="fila" onclick="ir('p/${p.id}')"><div class="t">${esc(p.nombre)} <span class="chip ${p.estado==='aprobado'?'ok':p.estado==='enviado'?'bl':''}">${ESTADOS[p.estado]}</span>${p.rapido?'<span class="chip">rápido</span>':''}<small>${esc(p.cliente||'Sin cliente')} · ${esc(p.fecha)}</small></div><div class="v">${fmt(t.totalRed)}</div></div>`}).join('')+'</div><label class="btn sec">Sumar desde archivo<input type="file" accept=".json" hidden onchange="sumarArchivo(this.files[0])"></label>'}
function nuevoPresupuesto(){
  modal(`<h3 style="margin-top:0">Nuevo presupuesto</h3>
  <label class="c"><span>Nombre</span><input class="i" id="np_n" placeholder="Ej. Cabaña lote 10"></label>
  <label class="c"><span>Cliente</span><input class="i" id="np_c"></label>
  <label class="c"><span>Tipo</span><select class="i" id="np_t"><option value="obra">Obra (capítulos y APU)</option><option value="rapido">Trabajo pequeño o mueble (modo rápido)</option></select></label>
  <div class="btns"><button class="btn" id="np_ok">Crear</button><button class="btn sec" onclick="cerrarModal()">Cancelar</button></div>`,b=>{
    $('#np_ok',b).onclick=()=>{const n=$('#np_n',b).value.trim()||'Presupuesto sin nombre';const rap=$('#np_t',b).value==='rapido';
      const p={id:uid('p'),nombre:n,cliente:$('#np_c',b).value.trim(),proyecto:'',fecha:hoy(),estado:'borrador',rapido:rap,
        aiu:{...D.config.aiu},ivaModo:'no',notas:'',capitulos:rap?[{id:uid('c'),nombre:'Trabajo',items:[]}]:[],mod:new Date().toISOString()};
      D.presupuestos.push(p);guardar();cerrarModal();ir('p/'+p.id)}})}
function presDe(id){return D.presupuestos.find(p=>p.id===id)}
function bloqueado(p){return p.estado==='aprobado'}
function vPresupuesto(v,id,sub,itId){
  const p=presDe(id);if(!p){ir('presupuestos');return}
  if(sub==='r'){const it=p.capitulos.flatMap(c=>c.items).find(x=>x.id===itId);if(!it){ir('p/'+id);return}vEditorAPU(v,it.apu,{pres:p,item:it});return}
  setTitulo(p.nombre,'presupuestos');const t=calcPres(p);const bl=bloqueado(p);
  if(!bl)fab(()=>agregarItem(p));
  const caps=p.capitulos.map((c,ci)=>`<details class="card" open><summary>${esc(c.nombre)}<span class="s">${fmt(t.caps[ci])}</span></summary>
    ${c.items.map(it=>{const a=itemAPU(p,it);const pu=puItem(p,it);const est=a&&apuEstimado(a);return`<div class="fila" onclick="abrirItem('${p.id}','${it.id}')"><div class="t">${esc(a?(a.cod&&!a.cod.startsWith('R')?a.cod+' ':'')+a.nombre:'(APU borrado)')}${it.tipo==='rapido'?' <span class="chip">rápido</span>':''}${est?' <span class="chip est">estimado</span>':''}<small>${fnum(it.cant)} ${esc(a?.und||'')} × ${fmt(pu)}</small></div><div class="v">${fmt(pu*(+it.cant||0))}</div></div>`}).join('')||'<div class="fila mut">Sin ítems</div>'}
    ${bl?'':`<div class="btns pad" style="margin:0"><button class="btn mini sec" onclick="agregarItem(presDe('${p.id}'),'${c.id}')">+ Ítem</button><button class="btn mini sec" onclick="editarCap('${p.id}','${c.id}')">Renombrar o borrar</button></div>`}</details>`).join('');
  v.innerHTML=`${bl?'<div class="aviso">Presupuesto aprobado: los precios quedaron congelados y no se puede editar. Para cambiarlo, vuélvelo a borrador.</div>':''}
  <div class="card pad">
   <div class="g2"><label class="c"><span>Nombre</span><input class="i" data-k="nombre" value="${esc(p.nombre)}"></label><label class="c"><span>Cliente</span><input class="i" data-k="cliente" value="${esc(p.cliente)}"></label></div>
   <div class="g2"><label class="c"><span>Proyecto / dirección</span><input class="i" data-k="proyecto" value="${esc(p.proyecto)}"></label><label class="c"><span>Fecha</span><input class="i" type="date" data-k="fecha" value="${esc(p.fecha)}"></label></div>
   <div class="g3"><label class="c"><span>Administración %</span><input class="i num" data-aiu="a" value="${fnum(p.aiu.a)}"></label><label class="c"><span>Imprevistos %</span><input class="i num" data-aiu="i" value="${fnum(p.aiu.i)}"></label><label class="c"><span>Utilidad %</span><input class="i num" data-aiu="u" value="${fnum(p.aiu.u)}"></label></div>
   <div class="g2"><label class="c"><span>IVA</span><select class="i" data-k="ivaModo"><option value="no">No aplica</option><option value="utilidad">Sobre la utilidad (AIU)</option><option value="pleno">Pleno sobre el total</option></select></label>
   <label class="c"><span>Estado</span><select class="i" id="estado">${Object.entries(ESTADOS).map(([k,n])=>`<option value="${k}" ${p.estado===k?'selected':''}>${n}</option>`).join('')}</select></label></div>
   <label class="c"><span>Notas para el cliente (salen en el PDF)</span><textarea class="i" rows="2" data-k="notas">${esc(p.notas)}</textarea></label>
  </div>
  ${caps||'<div class="vacio">Agrega un capítulo o un ítem con el botón +</div>'}
  ${bl?'':`<div class="btns"><button class="btn sec" onclick="nuevoCap('${p.id}')">+ Capítulo</button></div>`}
  <div class="card">
   <div class="tot"><span>Costo directo</span><b>${fmt(t.cd)}</b></div>
   <div class="tot"><span>Administración ${fnum(p.aiu.a)} %</span><span>${fmt(t.a)}</span></div>
   <div class="tot"><span>Imprevistos ${fnum(p.aiu.i)} %</span><span>${fmt(t.i)}</span></div>
   <div class="tot"><span>Utilidad ${fnum(p.aiu.u)} %</span><span>${fmt(t.u)}</span></div>

function diferencias(a){if(!a.origen?.base)return[];const o=a.origen.base,d=[];const nom=c=>c.tipo==='bas'?(apuDe(c.apu)?.nombre||c.apu):(ins(c.ins)?.nombre||c.ins);

async function sumarArchivo(f){if(!f)return;let o;try{o=JSON.parse(await f.text())}catch(e){alert('Ese archivo no es válido');return}
  if(o.app!=='presupuestos'){alert('Ese archivo no es de la app Presupuestos');return}const n=await sumarCarga(o,true);
  alert(`Sumado: ${n.p} presupuesto(s), ${n.a} APU y ${n.i} insumos nuevos.`);if(n.p===1)ir('p/'+o.presupuestos[0].id);else render()}
async function sumarCarga(o,preguntar){let ni=0,na=0,np=0;(o.insumos||[]).forEach(x=>{if(!ins(x.id)){D.insumos.push(x);ni++}});(o.apus||[]).forEach(x=>{if(!apuDe(x.id)){D.apus.push(x);na++}});
  (o.cuadrillas||[]).forEach(x=>{if(!cuad(x.id))D.cuadrillas.push(x)});
  for(const p of (o.presupuestos||[])){const ex=presDe(p.id);if(ex){if(!preguntar||!confirm('Ya tienes "'+ex.nombre+'". ¿Reemplazarlo por el del archivo? (lo actual queda en Versiones guardadas)'))continue;D.presupuestos=D.presupuestos.filter(x=>x.id!==p.id)}D.presupuestos.push(p);np++}
  await guardarYa();return{i:ni,a:na,p:np}}
/* ---------- Buzón de Claude: cargas cifradas en buzon/ del repo ---------- */
async function descifrar(buf,clave){const b=new Uint8Array(buf);const salt=b.slice(0,16),iv=b.slice(16,28),ct=b.slice(28);
  const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(clave.trim()),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:200000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
  return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv},key,ct)))}
let revisando=false;
async function revisarBuzon(manual){const clave=D.claveBuzon;if(!clave){if(manual)toast('Primero escribe la clave del buzón');return}if(revisando)return;
  if(!navigator.onLine){if(manual)toast('Sin internet');return}revisando=true;
  try{const r=await fetch('buzon/indice.json?t='+Date.now(),{cache:'no-store'});if(!r.ok){if(manual)toast('No hay cargas en el buzón');return}
    const ind=await r.json();const hechos=new Set(D.buzonAplicados||[]);const desc=[];let tot={i:0,a:0,p:0};
    for(const c of (ind.cargas||[]).filter(c=>!hechos.has(c.id))){const rb=await fetch('buzon/'+c.archivo+'?t='+Date.now(),{cache:'no-store'});if(!rb.ok)throw new Error('Falta '+c.archivo);
      let o;try{o=await descifrar(await rb.arrayBuffer(),clave)}catch(e){throw new Error('La clave del buzón no abre "'+(c.desc||c.id)+'". Revísala en Ajustes.')}
      const n=await sumarCarga(o,false);for(const k in tot)tot[k]+=n[k];desc.push(c.desc||c.id);hechos.add(c.id);D.buzonAplicados=[...hechos];await guardarYa()}
    if(desc.length){alert('Llegó del buzón de Claude:\n• '+desc.join('\n• ')+`\n\nNuevos: ${tot.p} presupuesto(s), ${tot.a} APU, ${tot.i} insumos.`);render()}else if(manual)toast('No hay nada nuevo')}
  catch(e){manual?alert(e.message):toast(e.message)}finally{revisando=false}}

/* ================= Impresión ================= */
function encabezado(p,tit){const c=D.config;return`<div class="enc"><div><h1>${esc(tit)}</h1><div>${esc(p.nombre)}${p.proyecto?' · '+esc(p.proyecto):''}</div><div>Cliente: ${esc(p.cliente||'—')}</div></div><div style="text-align:right"><b>${esc(c.empresa)}</b><br>${esc(c.profesional)}<br>${esc(c.contacto||'')}<br>Fecha: ${esc(p.fecha)}</div></div>`}
function fechaPrecios(p){const ids=new Set();p.capitulos.forEach(c=>c.items.forEach(it=>{const a=itemAPU(p,it);(function rec(x,pila){(x?.comp||[]).forEach(k=>{if(k.tipo==='bas'){const b=apuDe(k.apu);if(b&&!pila.includes(b.id))rec(b,[...pila,b.id])}else ids.add(k.ins)})})(a,[])}));
  const f=[...ids].map(i=>ins(i)?.fecha).filter(Boolean).sort();return f.length?f[0]+' a '+f[f.length-1]:''}
function imprimirPres(id){const p=presDe(id),t=calcPres(p);
  const filas=p.capitulos.map((c,ci)=>`<tr class="cap"><td colspan="5">${esc(c.nombre)}</td><td class="n">${fmt(t.caps[ci])}</td></tr>`+c.items.map(it=>{const a=itemAPU(p,it);const pu=puItem(p,it);return`<tr><td>${esc(a&&a.cod&&a.cod!=='R'?a.cod:'')}</td><td>${esc(a?.nombre||'')}</td><td>${esc(a?.und||'')}</td><td class="n">${fnum(it.cant,2)}</td><td class="n">${fmt(pu)}</td><td class="n">${fmt(pu*(+it.cant||0))}</td></tr>`}).join('')).join('');
  $('#impresion').innerHTML=`${encabezado(p,'Presupuesto')}<table class="imp"><thead><tr><th>Cód.</th><th>Descripción</th><th>Und</th><th class="n">Cant.</th><th class="n">Valor unitario</th><th class="n">Valor total</th></tr></thead><tbody>${filas}</tbody></table>
  <table class="tabla-tot"><tr><td>Costo directo</td><td class="n">${fmt(t.cd)}</td></tr><tr><td>Administración ${fnum(p.aiu.a)} %</td><td class="n">${fmt(t.a)}</td></tr><tr><td>Imprevistos ${fnum(p.aiu.i)} %</td><td class="n">${fmt(t.i)}</td></tr><tr><td>Utilidad ${fnum(p.aiu.u)} %</td><td class="n">${fmt(t.u)}</td></tr><tr><td>IVA ${p.ivaModo==='no'?'(no aplica)':p.ivaModo==='utilidad'?(D.config.ivaPct||19)+' % sobre la utilidad':(D.config.ivaPct||19)+' %'}</td><td class="n">${fmt(t.iva)}</td></tr><tr><td><b>Total</b></td><td class="n"><b>${fmt(t.totalRed)}</b></td></tr></table>
  <p style="margin-top:14px">${p.ivaModo==='no'?'Valores sin IVA sobre el servicio. ':p.ivaModo==='utilidad'?'Incluye IVA sobre la utilidad. ':'Incluye IVA. '}Total redondeado al millar. Precios de materiales con IVA incluido, tomados de cotizaciones y listas de proveedores${fechaPrecios(p)?' ('+fechaPrecios(p)+')':''}. Presupuesto elaborado el ${esc(p.fecha)}.</p>${p.notas?`<p>${esc(p.notas).replace(/\n/g,'<br>')}</p>`:''}`;
  setTimeout(()=>window.print(),100)}
function imprimirAPU(id){const p=presDe(id);const vistos=new Set();let html=encabezado(p,'Análisis de precios unitarios');let n=0;
  p.capitulos.forEach(c=>c.items.forEach(it=>{const a=(p.estado==='aprobado'&&it.apuCongelado)||itemAPU(p,it);if(!a||vistos.has(a.id))return;vistos.add(a.id);const r=calcAPU(a);
    const fl=t=>r.lineas.filter(l=>t==='mat'?l.c.tipo==='mat':t==='bas'?l.c.tipo==='bas':l.c.tipo==='eq');
    const tb=(tit,L)=>L.length?`<tr class="cap"><td colspan="6">${tit}</td></tr>`+L.map(l=>`<tr><td>${esc(l.nombre)}</td><td>${esc(l.und)}</td><td class="n">${fnum(l.c.cant,4)}</td><td class="n">${fnum(l.c.desp||0)} %</td><td class="n">${fmt(l.precio)}</td><td class="n">${fmt(l.v)}</td></tr>`).join(''):'';
    html+=`<div ${n++%2===1?'':''} style="margin-bottom:14px;page-break-inside:avoid"><h3>${esc(a.cod&&a.cod!=='R'?a.cod+' ':'')}${esc(a.nombre)} · por ${esc(a.und)}</h3><table class="imp"><thead><tr><th>Insumo</th><th>Und</th><th class="n">Cant.</th><th class="n">Desp.</th><th class="n">Precio</th><th class="n">Valor</th></tr></thead><tbody>
    ${tb('Materiales',fl('mat'))}${tb('APU básicos',fl('bas'))}${tb('Equipo y transporte',fl('eq'))}
    <tr class="cap"><td colspan="5">Mano de obra (${esc(txtMO(a.mo))})</td><td class="n">${fmt(r.mo)}</td></tr>
    ${r.herr?`<tr><td colspan="5">Herramienta menor ${fnum(a.herr??D.config.herrPct)} % de la mano de obra</td><td class="n">${fmt(r.herr)}</td></tr>`:''}
    <tr><td colspan="5"><b>Valor unitario</b></td><td class="n"><b>${fmt(p.estado==='aprobado'&&it.puCongelado!=null?it.puCongelado:r.total)}</b></td></tr></tbody></table></div>`}));
  $('#impresion').innerHTML=html;setTimeout(()=>window.print(),100)}
window.addEventListener('afterprint',()=>{$('#impresion').innerHTML=''});
